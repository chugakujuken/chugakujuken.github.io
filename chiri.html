<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>地理 — 都道府県マップ練習</title>
  <link rel="stylesheet" href="assets/styles.css">
  
  <!-- japan-map-js CSS and JS -->
  <script src="https://unpkg.com/japan-map-js@1.0.1/dist/jpmap.min.js"></script>
  
  <style>
    body{font-family:'Helvetica Neue',Arial,sans-serif;background:#f5f5f5;color:#333;margin:0}
    .header{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,0.06);position:sticky;top:0}
    .main-content{max-width:1100px;margin:24px auto;padding:20px;background:#fff;border-radius:6px}
    .controls{display:flex;gap:8px;margin-bottom:12px}
    .hint{margin-top:12px;color:#666}
    .map-and-panel{display:flex;gap:16px;align-items:flex-start}
    .panel{flex:0 0 320px}
    .map-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
    .pref{background:#fff;border:1px solid #eee;padding:8px;border-radius:6px;text-align:center;cursor:pointer;margin-bottom:6px}
    .loading{display:none;color:#666;font-size:13px}
    @media(max-width:920px){.map-and-panel{flex-direction:column}.panel{width:100%}}
    
    /* japan-map specific styles */
    .japan-map-container { 
      width: 100%;
      height: 500px;
      border-radius: 8px;
      border: 1px solid #e6eef9;
      background: #f8fbff;
      overflow: hidden;
      position: relative;
    }
    
    .jpmap-area {
      cursor: pointer;
    }
    
    .pref.correct{background:#dff3e6;border-color:#7bd08c}
    .pref.wrong{background:#ffe6e6;border-color:#ff9b9b}
  </style>
</head>
<body>
  <header class="header">
    <nav style="padding:12px 20px;display:flex;gap:12px;justify-content:center">
      <a href="index.html">🏡 全般</a>
      <a href="sansu.html">算数</a>
      <a href="kokugo.html">国語</a>
      <a href="rika.html">理科</a>
      <a href="shakai.html">社会</a>
    </nav>
  </header>

  <main class="main-content">
    <h2>都道府県マップ練習</h2>
    <p>Japan-Map-JSライブラリを使用したインタラクティブな地図で都道府県を学びましょう。</p>

    <div class="controls">
      <button id="start" style="padding:8px 12px;border-radius:6px;background:#2176d2;color:#fff;border:none;">都道府県クイズ開始</button>
      <button id="start-capital-quiz" style="padding:8px 12px;border-radius:6px;background:#2176d2;color:#fff;border:none;">県庁所在地クイズ開始</button>
      <button id="start-region-quiz" style="padding:8px 12px;border-radius:6px;background:#2176d2;color:#fff;border:none;">地方クイズ開始</button>
      <button id="learning-mode" style="padding:8px 12px;border-radius:6px;background:#6c757d;color:#fff;border:none;">学習モード</button>
      <button id="stop" style="padding:8px 12px;border-radius:6px;background:#eee;border:1px solid #ddd;">停止</button>
      <button id="shuffle" style="padding:8px 12px;border-radius:6px;background:#fff;border:1px solid #ddd;">シャッフル</button>
      <button id="show-answer" style="padding:8px 12px;border-radius:6px;background:#fff;border:1px solid #ddd;">答えを見る</button>
    </div>

    <div class="map-and-panel">
      <div style="flex:1">
        <div class="japan-map-container" id="japan-map"></div>
      </div>

      <div class="panel">
        <div style="background:#fafafa;border:1px solid #eee;padding:12px;border-radius:8px">
          <h3 id="prompt">準備完了</h3>
          <div id="feedback" style="height:36px"></div>
          <div class="hint">正答数: <span id="score">0</span> / <span id="total">0</span></div>
        </div>
        <div id="quiz-instructions" style="margin-top:12px;font-size:13px;color:#666">クイズ: 地図上の都道府県をクリックして答えてください。右下の一覧からも選べます。</div>
        <hr style="margin:12px 0">
        <div style="max-height:360px;overflow:auto">
          <div class="map-grid" id="map-grid"></div>
        </div>
      </div>
    </div>

    <script src="assets/layout.js" defer></script>
    <script>
      // Detailed prefecture data (capital, region)
      const prefectureDetails = {
        '北海道': { capital: '札幌市', region: '北海道地方' },
        '青森県': { capital: '青森市', region: '東北地方' },
        '岩手県': { capital: '盛岡市', region: '東北地方' },
        '宮城県': { capital: '仙台市', region: '東北地方' },
        '秋田県': { capital: '秋田市', region: '東北地方' },
        '山形県': { capital: '山形市', region: '東北地方' },
        '福島県': { capital: '福島市', region: '東北地方' },
        '茨城県': { capital: '水戸市', region: '関東地方' },
        '栃木県': { capital: '宇都宮市', region: '関東地方' },
        '群馬県': { capital: '前橋市', region: '関東地方' },
        '埼玉県': { capital: 'さいたま市', region: '関東地方' },
        '千葉県': { capital: '千葉市', region: '関東地方' },
        '東京都': { capital: '新宿区', region: '関東地方' },
        '神奈川県': { capital: '横浜市', region: '関東地方' },
        '新潟県': { capital: '新潟市', region: '中部地方' },
        '富山県': { capital: '富山市', region: '中部地方' },
        '石川県': { capital: '金沢市', region: '中部地方' },
        '福井県': { capital: '福井市', region: '中部地方' },
        '山梨県': { capital: '甲府市', region: '中部地方' },
        '長野県': { capital: '長野市', region: '中部地方' },
        '岐阜県': { capital: '岐阜市', region: '中部地方' },
        '静岡県': { capital: '静岡市', region: '中部地方' },
        '愛知県': { capital: '名古屋市', region: '中部地方' },
        '三重県': { capital: '津市', region: '近畿地方' },
        '滋賀県': { capital: '大津市', region: '近畿地方' },
        '京都府': { capital: '京都市', region: '近畿地方' },
        '大阪府': { capital: '大阪市', region: '近畿地方' },
        '兵庫県': { capital: '神戸市', region: '近畿地方' },
        '奈良県': { capital: '奈良市', region: '近畿地方' },
        '和歌山県': { capital: '和歌山市', region: '近畿地方' },
        '鳥取県': { capital: '鳥取市', region: '中国地方' },
        '島根県': { capital: '松江市', region: '中国地方' },
        '岡山県': { capital: '岡山市', region: '中国地方' },
        '広島県': { capital: '広島市', region: '中国地方' },
        '山口県': { capital: '山口市', region: '中国地方' },
        '徳島県': { capital: '徳島市', region: '四国地方' },
        '香川県': { capital: '高松市', region: '四国地方' },
        '愛媛県': { capital: '松山市', region: '四国地方' },
        '高知県': { capital: '高知市', region: '四国地方' },
        '福岡県': { capital: '福岡市', region: '九州地方' },
        '佐賀県': { capital: '佐賀市', region: '九州地方' },
        '長崎県': { capital: '長崎市', region: '九州地方' },
        '熊本県': { capital: '熊本市', region: '九州地方' },
        '大分県': { capital: '大分市', region: '九州地方' },
        '宮崎県': { capital: '宮崎市', region: '九州地方' },
        '鹿児島県': { capital: '鹿児島市', region: '九州地方' },
        '沖縄県': { capital: '那覇市', region: '九州地方' }
      };

      // 47 都道府県（日本語）
      const prefectures = [
        '北海道','青森県','岩手県','宮城県','秋田県','山形県','福島県',
        '茨城県','栃木県','群馬県','埼玉県','千葉県','東京都','神奈川県',
        '新潟県','富山県','石川県','福井県','山梨県','長野県','岐阜県',
        '静岡県','愛知県','三重県','滋賀県','京都府','大阪府','兵庫県',
        '奈良県','和歌山県','鳥取県','島根県','岡山県','広島県','山口県',
        '徳島県','香川県','愛媛県','高知県','福岡県','佐賀県','長崎県',
        '熊本県','大分県','宮崎県','鹿児島県','沖縄県'
      ];

      // Prefecture codes for japan-map-js (1-47, where 1=Hokkaido, 47=Okinawa)
      const prefCodes = {};
      for (let i = 0; i < prefectures.length; i++) {
        prefCodes[prefectures[i]] = i + 1;
      }

      const promptEl = document.getElementById('prompt');
      const feedback = document.getElementById('feedback');
      const scoreEl = document.getElementById('score');
      const totalEl = document.getElementById('total');
      const quizInstructionsEl = document.getElementById('quiz-instructions');

      let order = prefectures.slice();
      let current = null;
      let running = false;
      let quizMode = 'learning'; // 'learning', 'prefecture', 'capital', 'region'
      let score = 0;
      let total = 0;
      let japanMapInstance = null;
      let areaColors = []; // Store current colors for each prefecture

      // Initialize the Japan map
      function initJapanMap() {
        japanMapInstance = new jpmap.japanMap(document.getElementById("japan-map"), {
          width: '100%',
          height: '100%',
          borderLineWidth: 1,
          borderLineColor: '#888',
          showsPrefectureName: true,
          lang: 'ja',
          movesIslands: true,
          onSelect: function(data) {
            const selectedPrefecture = data.name;

            if (quizMode === 'learning') {
              displayPrefectureInfo(selectedPrefecture);
              setPrefectureColor(selectedPrefecture, '#3498db'); // Highlight on click
              setTimeout(() => resetAllColors(), 1000);
              return;
            }

            if (!running) {
              feedback.textContent = 'クイズを開始してください。';
              return;
            }

            handleQuizAnswer(selectedPrefecture);
          }
        });
        initializeColors();
      }

      function displayPrefectureInfo(prefectureName) {
        const details = prefectureDetails[prefectureName];
        if (details) {
          promptEl.innerHTML = `<strong>${prefectureName}</strong><br>県庁所在地: ${details.capital}<br>地方: ${details.region}`;
          feedback.textContent = '';
        } else {
          promptEl.textContent = prefectureName;
          feedback.textContent = '詳細情報がありません。';
        }
      }

      function handleQuizAnswer(selectedPrefecture) {
        let isCorrect = false;
        let correctAnswer = '';

        if (quizMode === 'prefecture') {
          isCorrect = (selectedPrefecture === current);
          correctAnswer = current;
        } else if (quizMode === 'capital') {
          const correctCapital = prefectureDetails[current].capital;
          isCorrect = (prefectureDetails[selectedPrefecture].capital === correctCapital);
          correctAnswer = current + ' (県庁所在地: ' + correctCapital + ')';
        } else if (quizMode === 'region') {
          const correctRegion = prefectureDetails[current].region;
          isCorrect = (prefectureDetails[selectedPrefecture].region === correctRegion);
          correctAnswer = current + ' (地方: ' + correctRegion + ')';
        }

        if (isCorrect) {
          setPrefectureColor(selectedPrefecture, '#2ecc71');
          feedback.textContent = '正解！';
          score++;
        } else {
          setPrefectureColor(selectedPrefecture, '#e74c3c');
          setPrefectureColor(current, '#2ecc71'); // Show correct answer
          feedback.textContent = '不正解！正解は: ' + correctAnswer;
        }

        total++;
        scoreEl.textContent = score;
        totalEl.textContent = total;

        setTimeout(() => {
          resetAllColors();
          feedback.textContent = '';
          nextQuiz();
        }, 1500);
      }

      function initializeColors() {
        areaColors = [];
        for (let i = 1; i <= 47; i++) {
          areaColors.push({code: i, color: '#ffffff'});
        }
        japanMapInstance.setAreaColors(areaColors);
      }

      function setPrefectureColor(prefectureName, color) {
        const code = prefCodes[prefectureName];
        if (code) {
          japanMapInstance.setAreaColors([{code: code, color: color}]);
        }
      }

      function resetAllColors() {
        areaColors = [];
        for (let i = 1; i <= 47; i++) {
          areaColors.push({code: i, color: '#ffffff'});
        }
        japanMapInstance.setAreaColors(areaColors);
      }

      function createMapGrid() {
        const grid = document.getElementById('map-grid');
        grid.innerHTML = '';

        prefectures.forEach(name => {
          const btn = document.createElement('button');
          btn.className = 'pref';
          btn.textContent = name;
          btn.dataset.name = name;
          btn.addEventListener('click', () => {
            if (quizMode === 'learning') {
              displayPrefectureInfo(name);
              setPrefectureColor(name, '#3498db');
              setTimeout(() => resetAllColors(), 1000);
              return;
            }

            if (!running) {
              feedback.textContent = 'クイズを開始してください。';
              return;
            }

            handleQuizAnswer(name);
          });
          grid.appendChild(btn);
        });
      }

      function nextQuiz() {
        if (!running) return;
        if (order.length === 0) {
          promptEl.textContent = 'クイズ完了！';
          running = false;
          return;
        }
        current = order.shift();

        if (quizMode === 'prefecture') {
          promptEl.textContent = '選択: ' + current;
          quizInstructionsEl.textContent = '地図上の都道府県をクリックして答えてください。右下の一覧からも選べます。';
        } else if (quizMode === 'capital') {
          promptEl.textContent = current + ' の県庁所在地はどこ？';
          quizInstructionsEl.textContent = '地図上の県庁所在地がある都道府県をクリックして答えてください。';
        } else if (quizMode === 'region') {
          promptEl.textContent = current + ' はどの地方？';
          quizInstructionsEl.textContent = '地図上の地方に属する都道府県をクリックして答えてください。';
        }
      }

      function startQuiz(type) {
        running = true;
        quizMode = type;
        score = 0;
        total = 0;
        scoreEl.textContent = 0;
        totalEl.textContent = 0;
        order = shuffle(prefectures.slice());
        initializeColors();
        createMapGrid();
        nextQuiz();
      }

      document.getElementById('start').addEventListener('click', () => startQuiz('prefecture'));
      document.getElementById('start-capital-quiz').addEventListener('click', () => startQuiz('capital'));
      document.getElementById('start-region-quiz').addEventListener('click', () => startQuiz('region'));

      document.getElementById('learning-mode').addEventListener('click', () => {
        running = false;
        quizMode = 'learning';
        promptEl.textContent = '学習モード: 都道府県をクリックして情報を表示';
        quizInstructionsEl.textContent = '地図上の都道府県をクリックすると、その都道府県の情報が表示されます。';
        feedback.textContent = '';
        resetAllColors();
      });

      document.getElementById('stop').addEventListener('click', () => {
        running = false;
        promptEl.textContent = '停止中';
        quizInstructionsEl.textContent = '';
        current = null;
        resetAllColors();
      });

      document.getElementById('shuffle').addEventListener('click', () => {
        order = shuffle(prefectures.slice());
        promptEl.textContent = '順番をシャッフルしました';
        if (running) nextQuiz();
      });

      document.getElementById('show-answer').addEventListener('click', () => {
        if (running && current) {
          let answerText = '';
          if (quizMode === 'prefecture') {
            answerText = current;
          } else if (quizMode === 'capital') {
            answerText = prefectureDetails[current].capital;
          } else if (quizMode === 'region') {
            answerText = prefectureDetails[current].region;
          }
          feedback.textContent = '答え: ' + answerText;
          setPrefectureColor(current, '#2ecc71'); // Highlight correct answer
          setTimeout(() => resetAllColors(), 1500);
        }
      });

      function shuffle(a) {
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      window.onload = function() {
        initJapanMap();
        createMapGrid();
        totalEl.textContent = 0;
        scoreEl.textContent = 0;
        promptEl.textContent = '準備完了';
        quizInstructionsEl.textContent = 'モードを選択してください。';
      };
    </script>

  </main>
</body>
</html>
